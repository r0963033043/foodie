<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Menu · foodie</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<button id="langBtn" class="lang-btn" type="button">中文</button>
<div class="wrap">

  <header class="hero">
    <div class="crumb"><a id="backLink" href="maps.html"></a></div>
    <div class="eatery-head">
      <span class="ic" id="emoji"></span>
      <div>
        <h1 id="name"></h1>
        <p class="subtitle" id="cuisine"></p>
      </div>
    </div>
    <p class="addr" id="addr"></p>
    <div class="branches" id="branchList"></div>
    <div class="tags" id="tags"></div>
  </header>

  <!-- Links -->
  <section class="card refs">
    <h2><span class="ic">🔗</span> <span id="linksTitle"></span></h2>
    <div id="linksBody"></div>
  </section>

  <!-- Menu -->
  <section class="card">
    <h2><span class="ic">🍽</span> <span id="menuTitle"></span></h2>
    <div id="menuBody"></div>
  </section>

  <footer>foodie · menu</footer>

</div>

<script src="api.js"></script>
<script src="links.js"></script>
<script>
  (function () {
    const LANG_KEY = "foodie.lang";
    const $ = function (id) { return document.getElementById(id); };
    let ui = null;             // i18n.json ui block: { en:{…}, zh:{…} }
    let eatery = null;           // the eatery being shown
    let lang = "en";

    function store(key, val) { try { localStorage.setItem(key, val); } catch (e) {} }
    function load(key) { try { return localStorage.getItem(key); } catch (e) { return null; } }

    function el(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text != null) node.textContent = text;
      return node;
    }

    // Compose a display address from its parts, ordered per language:
    // en → "street, district, city"; zh → "city district street" (no commas).
    function fmtAddress(L_) {
      const parts = lang === "zh"
        ? [L_.city, L_.district, L_.address]
        : [L_.address, L_.district, L_.city];
      const sep = lang === "zh" ? "" : ", ";
      return parts.filter(Boolean).join(sep);
    }

    // An eatery's locations for display in the current language: { name, parts }
    // where parts feeds fmtAddress. name is null for an unnamed (single) location.
    function branchInfos(r) {
      return (r.locations || []).map(function (b) {
        const L_ = b[lang] || {};
        return { name: L_.name || null, parts: L_ };
      });
    }

    // The eatery's main (first) location address, formatted.
    function mainAddr(r) {
      const loc = (r.locations || [])[0];
      return loc ? fmtAddress(loc[lang] || {}) : "";
    }

    // Union of a per-location field (current language) across all locations.
    function locField(r, key) {
      const out = [];
      (r.locations || []).forEach(function (loc) {
        const v = loc[lang] && loc[lang][key];
        if (v == null) return;
        (Array.isArray(v) ? v : [v]).forEach(function (x) { if (out.indexOf(x) === -1) out.push(x); });
      });
      return out;
    }

    // Suitable party size, e.g. "2", "1–4", or "2+" (open-ended max).
    function fmtPartySize(p) {
      if (!p || p.min == null) return null;
      if (p.max == null) return p.min + "+";
      return p.min === p.max ? String(p.min) : p.min + "–" + p.max;
    }

    // External search/links — same queries the map popup uses.
    function gmapsUrl(r) {
      return FoodieLinks.gmaps(r[lang].name + " " + mainAddr(r));
    }
    function nameQuery(r) {
      const loc = (r.locations || [])[0];
      const city = (loc && loc[lang] && loc[lang].city) || "";
      return r[lang].name + " " + city;
    }
    function webUrl(r) { return FoodieLinks.webSearch(nameQuery(r)); }
    function youtubeUrl(r) { return FoodieLinks.youtubeSearch(nameQuery(r)); }

    // Website/social link display names. "official" is localized; brand names
    // are the same in both languages.
    const WEBSITE_LABEL = {
      facebook: "Facebook", instagram: "Instagram", line: "LINE",
      youtube: "YouTube", threads: "Threads", tiktok: "TikTok", x: "X"
    };
    function siteLabel(platform) {
      if (platform === "official") return ui[lang].website;
      return WEBSITE_LABEL[platform] || platform;
    }

    // Append one link per website entry ({ platform, url }); also accepts a bare
    // url string (treated as an official site). Skips blanks.
    function appendWebsites(host, r) {
      const raw = r.website;
      const list = Array.isArray(raw) ? raw
        : (typeof raw === "string" && raw ? [{ platform: "official", url: raw }] : []);
      list.forEach(function (w) {
        if (w && w.url) host.appendChild(extLink(siteLabel(w.platform) + " ↗", w.url));
      });
    }

    // Booking links from data: an array of { platform, url } (a bare url string
    // is also accepted). Returns only the entries that actually have a url.
    function reserveOptions(r) {
      const raw = r.reservationUrl;
      const list = Array.isArray(raw) ? raw
        : (typeof raw === "string" && raw ? [{ platform: "other", url: raw }] : []);
      return list.filter(function (o) { return o && o.url; });
    }

    // inline.app booking pages honor a `language` query param. inline.app already
    // defaults to English, so only force it when the UI is in Chinese (zh-tw);
    // English and other platforms pass through unchanged.
    function reserveHref(o) {
      if (o.platform !== "inline" || lang !== "zh") return o.url;
      try {
        const u = new URL(o.url);
        u.searchParams.set("language", "zh-tw");
        return u.toString();
      } catch (e) {
        return o.url;
      }
    }

    // Append the reservation link(s): nothing when there's no booking link, a
    // single direct link for one option, or one labeled link per platform when
    // several are available.
    function appendReservation(host, r) {
      const t = ui[lang];
      const opts = reserveOptions(r);
      if (opts.length === 0) return;
      if (opts.length === 1) { host.appendChild(extLink(t.reservations + " ↗", reserveHref(opts[0]))); return; }
      opts.forEach(function (o) {
        const key = "reservePlatform" + o.platform.charAt(0).toUpperCase() + o.platform.slice(1);
        host.appendChild(extLink(t.reservations + " · " + (t[key] || o.platform) + " ↗", reserveHref(o)));
      });
    }

    function extLink(text, href) {
      const a = el("a", null, text);
      a.href = href;
      a.target = "_blank";
      a.rel = "noopener";
      return a;
    }

    function render() {
      const t = ui[lang];
      const L_ = eatery[lang];

      document.documentElement.lang = lang === "zh" ? "zh-Hant" : "en";
      document.title = L_.name + " · menu";

      $("langBtn").textContent = t.langToggle;
      $("backLink").textContent = t.backToMaps;
      $("emoji").textContent = eatery.emoji || "🍴";
      $("name").textContent = L_.name;
      $("cuisine").textContent = L_.cuisine;
      $("addr").textContent = mainAddr(eatery);

      // Location list: when the eatery has multiple locations, list each one's
      // name + address and hide the single (main) address line.
      const branchHost = $("branchList");
      branchHost.innerHTML = "";
      const infos = branchInfos(eatery);
      const multi = infos.length > 1;
      $("addr").style.display = multi ? "none" : "";
      if (multi) infos.forEach(function (b) {
        const row = el("div", "branch");
        if (b.name) row.appendChild(el("span", "branch-name", b.name));
        row.appendChild(el("span", "branch-addr", fmtAddress(b.parts)));
        branchHost.appendChild(row);
      });

      // Header chips, mirroring the map card (no distance chip — that's map-only).
      const tags = $("tags");
      tags.innerHTML = "";
      const areas = locField(eatery, "shoppingDistrict");
      const meals = L_.mealtime || [];
      const gtags = L_.tags || [];
      const service = L_.service || [];
      const party = fmtPartySize(eatery.partySize);
      areas.forEach(function (a) { tags.appendChild(el("span", "chip chip-area", "📍 " + a)); });
      gtags.forEach(function (g) { tags.appendChild(el("span", "chip chip-tag", g)); });
      if (eatery.price) tags.appendChild(el("span", "chip chip-price", eatery.price));
      if (party) tags.appendChild(el("span", "chip chip-party", "👥 " + party));
      meals.forEach(function (m) { tags.appendChild(el("span", "chip chip-meal", m)); });
      service.forEach(function (s) { tags.appendChild(el("span", "chip chip-service", s)); });
      if (eatery.hasBranches) tags.appendChild(el("span", "chip chip-branch", "🏬 " + t.branches));

      // Menu items (per-language list of { name, price, note }).
      $("menuTitle").textContent = t.menu;
      const body = $("menuBody");
      body.innerHTML = "";
      const items = L_.menu || [];
      if (!items.length) {
        body.appendChild(el("p", "empty", t.menuSoon));
      } else {
        const list = el("ul", "list");
        items.forEach(function (it) {
          const li = el("li");
          const name = el("div", "menu-name");
          name.appendChild(el("span", null, it.name));
          if (it.note) name.appendChild(el("span", "sub", it.note));
          li.appendChild(name);
          li.appendChild(el("span", "qty", it.price || ""));
          list.appendChild(li);
        });
        body.appendChild(list);
        if (eatery.menuUpdated) {
          body.appendChild(el("p", "menu-updated", t.menuUpdated + " · " + eatery.menuUpdated));
        }
      }

      // Links
      $("linksTitle").textContent = t.links;
      const links = $("linksBody");
      links.innerHTML = "";
      appendReservation(links, eatery);
      appendWebsites(links, eatery);
      links.appendChild(extLink(t.openInMaps, gmapsUrl(eatery)));
      links.appendChild(extLink(t.searchWeb, webUrl(eatery)));
      links.appendChild(extLink(t.searchYoutube, youtubeUrl(eatery)));
    }

    function fail(msg) {
      document.querySelector(".wrap").innerHTML =
        "<p style='color:var(--muted)'>" + msg + "</p>";
    }

    const eateryId = new URLSearchParams(location.search).get("id");
    Promise.all([
      fetch("i18n.json").then(function (r) { return r.json(); }),
      eateryId ? FoodieApi.getEatery(eateryId)
             : FoodieApi.getEateries().then(function (rs) { return rs[0]; })
    ])
      .then(function (res) {
        ui = res[0].ui;
        eatery = res[1];
        lang = ui[load(LANG_KEY)] ? load(LANG_KEY) : "en";
        if (!eatery) { fail("Eatery not found."); return; }
        render();
      })
      .catch(function () {
        fail("Could not load eatery data. Serve this page over HTTP — browsers block fetch on file://.");
      });

    $("langBtn").addEventListener("click", function () {
      if (!ui) return;
      lang = (lang === "zh") ? "en" : "zh";
      store(LANG_KEY, lang);
      render();
    });
  })();
</script>
</body>
</html>
