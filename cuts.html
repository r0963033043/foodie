<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Meat Cuts · foodie</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<button id="langBtn" class="lang-btn" type="button">中文</button>
<div class="wrap">

  <header class="hero">
    <div class="crumb"><a id="backLink" href="index.html"></a></div>
    <h1 id="title"></h1>
    <p class="subtitle" id="subtitle"></p>
  </header>

  <div id="sections"></div>

  <footer>foodie · cuts</footer>

</div>

<script>
  (function () {
    const LANG_KEY = "foodie.lang";
    const $ = function (id) { return document.getElementById(id); };
    let ui = null;             // i18n.json ui block: { en:{…}, zh:{…} }
    let cuts = null;           // data/cuts.json
    let methodIndex = {};      // cooking-method code -> { code, en, zh }
    let lang = "en";

    function store(key, val) { try { localStorage.setItem(key, val); } catch (e) {} }
    function load(key) { try { return localStorage.getItem(key); } catch (e) { return null; } }

    function el(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text != null) node.textContent = text;
      return node;
    }

    // Animal names are stored as an array of single-language objects,
    // e.g. [{ "en": "Pork" }, { "zh": "豬肉" }]; pick the current language.
    function pickLang(arr) {
      if (!Array.isArray(arr)) return "";
      for (let i = 0; i < arr.length; i++) {
        if (arr[i] && arr[i][lang] != null) return arr[i][lang];
      }
      return "";
    }

    // One "Best / Avoid" line: a label plus a chip per cooking-method code.
    function cookRow(cls, label, codes) {
      if (!Array.isArray(codes) || !codes.length) return null;
      const row = el("div", "cut-cook " + cls);
      row.appendChild(el("span", "cook-label", label));
      codes.forEach(function (code) {
        const m = methodIndex[code] || {};
        row.appendChild(el("span", "cook-chip", m[lang] || code));
      });
      return row;
    }

    function render() {
      const t = ui[lang];
      const meta = cuts[lang] || {};
      document.documentElement.lang = lang === "zh" ? "zh-Hant" : "en";
      document.title = (meta.name || "") + " · foodie";

      $("langBtn").textContent = t.langToggle;
      $("backLink").textContent = t.homeCrumb;
      $("title").textContent = meta.name || "";
      $("subtitle").textContent = meta.subtitle || "";

      const wrap = $("sections");
      wrap.innerHTML = "";

      (cuts.animals || []).forEach(function (animal) {
        const card = el("section", "card");
        const h2 = el("h2");
        if (animal.emoji) h2.appendChild(el("span", "ic", animal.emoji));
        h2.appendChild(el("span", null, pickLang(animal.name)));
        card.appendChild(h2);

        const ul = el("ul", "cuts");
        (animal.cuts || []).forEach(function (cut) {
          const c = cut[lang] || {};
          const li = el("li");

          const nameRow = el("div", "cut-head");
          nameRow.appendChild(el("span", "cut-name", c.name || ""));
          if (c.alt) nameRow.appendChild(el("span", "cut-alt", c.alt));
          li.appendChild(nameRow);

          if (c.desc) li.appendChild(el("div", "cut-desc", c.desc));

          const best = cookRow("cook-best", t.cookBest, cut.best);
          if (best) li.appendChild(best);
          const worst = cookRow("cook-worst", t.cookWorst, cut.worst);
          if (worst) li.appendChild(worst);

          ul.appendChild(li);
        });
        card.appendChild(ul);
        wrap.appendChild(card);
      });
    }

    Promise.all([
      fetch("i18n.json").then(function (r) { return r.json(); }),
      fetch("data/cuts.json").then(function (r) { return r.json(); })
    ])
      .then(function (res) {
        ui = res[0].ui;
        cuts = res[1];
        (cuts.methods || []).forEach(function (m) { methodIndex[m.code] = m; });
        lang = ui[load(LANG_KEY)] ? load(LANG_KEY) : "en";
        render();
      })
      .catch(function () {
        $("sections").innerHTML =
          "<p style='color:var(--muted)'>Could not load cut data from <code>data/</code>. Serve this page over HTTP (e.g. <code>python -m http.server</code>) — browsers block fetch on file://.</p>";
      });

    $("langBtn").addEventListener("click", function () {
      if (!ui) return;
      lang = (lang === "zh") ? "en" : "zh";
      store(LANG_KEY, lang);
      render();
    });
  })();
</script>
</body>
</html>
