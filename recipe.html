<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Recipes · foodie</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<button id="langBtn" class="lang-btn" type="button">中文</button>
<div class="wrap">

  <header class="hero">
    <div class="crumb"><a id="backLink" href="index.html"></a></div>
    <div class="brand">foodie</div>
    <h1 id="title"></h1>
    <p class="subtitle" id="subtitle"></p>
  </header>

  <div class="grid" id="grid"></div>

  <footer>foodie · recipes</footer>

</div>

<script src="api.js"></script>
<script>
  (function () {
    const LANG_KEY = "foodie.lang";
    const $ = function (id) { return document.getElementById(id); };
    let ui = null;
    let dishes = [];           // [{ id, name:{en,zh} }] from the API
    let lang = "en";

    function store(key, val) { try { localStorage.setItem(key, val); } catch (e) {} }
    function load(key) { try { return localStorage.getItem(key); } catch (e) { return null; } }

    function el(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text != null) node.textContent = text;
      return node;
    }

    function render() {
      const t = ui[lang];
      document.documentElement.lang = lang === "zh" ? "zh-Hant" : "en";

      $("langBtn").textContent = t.langToggle;
      $("backLink").textContent = t.homeCrumb;
      $("title").textContent = t.recipesTitle;
      $("subtitle").textContent = t.recipesSubtitle;

      const grid = $("grid");
      grid.innerHTML = "";
      dishes.forEach(function (d) {
        const card = el("a", "dish-card");
        card.href = "dish.html?id=" + encodeURIComponent(d.id);

        const meta = el("div", "meta");
        meta.appendChild(el("span", "ic", "🍳"));
        meta.appendChild(el("span", "name", d.name[lang]));
        card.appendChild(meta);
        card.appendChild(el("span", "arrow", "→"));

        grid.appendChild(card);
      });
    }

    Promise.all([
      fetch("i18n.json").then(function (r) { return r.json(); }),
      FoodieApi.listDishes()
    ])
      .then(function (res) {
        ui = res[0].ui;
        dishes = res[1];
        lang = ui[load(LANG_KEY)] ? load(LANG_KEY) : "en";
        render();
      })
      .catch(function () {
        $("grid").innerHTML =
          "<p style='color:var(--muted)'>Could not load recipe data. Serve this page over HTTP — browsers block fetch on file://.</p>";
      });

    $("langBtn").addEventListener("click", function () {
      if (!ui) return;
      lang = (lang === "zh") ? "en" : "zh";
      store(LANG_KEY, lang);
      render();
    });
  })();
</script>
</body>
</html>
