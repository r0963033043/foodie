<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Recipes · foodie</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<button id="langBtn" class="lang-btn" type="button">中文</button>
<div class="wrap">

  <header class="hero">
    <div class="crumb"><a id="backLink" href="index.html"></a></div>
    <div class="brand">foodie</div>
    <h1 id="title"></h1>
    <p class="subtitle" id="subtitle"></p>
  </header>

  <div class="filters" id="filters"></div>

  <div class="grid" id="grid"></div>

  <footer>foodie · recipes</footer>

</div>

<script src="api.js"></script>
<script>
  (function () {
    const LANG_KEY = "foodie.lang";
    const $ = function (id) { return document.getElementById(id); };
    let ui = null;
    let dishes = [];           // [{ id, name:{en,zh}, cookware:[code…] }] from the API
    let cookwareNames = null;  // cookware.json: { en:{CODE:…}, zh:{CODE:…} }
    let cookwareOrder = [];    // cookware codes present in the catalogue, in file order
    let lang = "en";
    const selected = new Set(); // selected cookware codes (empty = show all)

    function store(key, val) { try { localStorage.setItem(key, val); } catch (e) {} }
    function load(key) { try { return localStorage.getItem(key); } catch (e) { return null; } }

    function el(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text != null) node.textContent = text;
      return node;
    }

    function render() {
      const t = ui[lang];
      document.documentElement.lang = lang === "zh" ? "zh-Hant" : "en";

      $("langBtn").textContent = t.langToggle;
      $("backLink").textContent = t.homeCrumb;
      $("title").textContent = t.recipesTitle;
      $("subtitle").textContent = t.recipesSubtitle;

      // Cookware filter — one group of toggle chips (OR within the group; an
      // empty selection shows everything). Codes resolve to names via
      // cookware.json; order follows the file.
      const filters = $("filters");
      filters.innerHTML = "";
      if (cookwareOrder.length) {
        const group = el("div", "filter-group");
        group.appendChild(el("span", "filter-label", t.filterCookware));
        cookwareOrder.forEach(function (code) {
          const label = (cookwareNames[lang] && cookwareNames[lang][code]) || code;
          const chip = el("button", "filter-chip" + (selected.has(code) ? " on" : ""), label);
          chip.type = "button";
          chip.addEventListener("click", function () {
            if (selected.has(code)) selected.delete(code);
            else selected.add(code);
            render();
          });
          group.appendChild(chip);
        });
        filters.appendChild(group);
      }

      const grid = $("grid");
      grid.innerHTML = "";
      const shown = selected.size
        ? dishes.filter(function (d) {
            return d.cookware.some(function (c) { return selected.has(c); });
          })
        : dishes;
      shown.forEach(function (d) {
        const card = el("a", "dish-card");
        card.href = "dish.html?id=" + encodeURIComponent(d.id);

        const meta = el("div", "meta");
        meta.appendChild(el("span", "ic", "🍳"));
        meta.appendChild(el("span", "name", d.name[lang]));
        card.appendChild(meta);
        card.appendChild(el("span", "arrow", "→"));

        grid.appendChild(card);
      });
    }

    Promise.all([
      fetch("i18n.json").then(function (r) { return r.json(); }),
      fetch("data/cookware.json").then(function (r) { return r.json(); }),
      FoodieApi.listDishes()
    ])
      .then(function (res) {
        ui = res[0].ui;
        cookwareNames = res[1];
        dishes = res[2];
        lang = ui[load(LANG_KEY)] ? load(LANG_KEY) : "en";
        // Build the chip order from the cookware file, keeping only codes that
        // some dish actually uses.
        const present = {};
        dishes.forEach(function (d) {
          d.cookware.forEach(function (c) { present[c] = true; });
        });
        cookwareOrder = Object.keys(cookwareNames.en).filter(function (c) {
          return present[c];
        });
        render();
      })
      .catch(function () {
        $("grid").innerHTML =
          "<p style='color:var(--muted)'>Could not load recipe data. Serve this page over HTTP — browsers block fetch on file://.</p>";
      });

    $("langBtn").addEventListener("click", function () {
      if (!ui) return;
      lang = (lang === "zh") ? "en" : "zh";
      store(LANG_KEY, lang);
      render();
    });
  })();
</script>
</body>
</html>
