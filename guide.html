<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ingredient Guide · foodie</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<button id="langBtn" class="lang-btn" type="button">中文</button>
<div class="wrap">

  <header class="hero">
    <div class="crumb"><a id="backLink" href="index.html"></a></div>
    <h1 id="title"></h1>
    <p class="subtitle" id="subtitle"></p>
  </header>

  <div class="grid">
    <a class="dish-card" href="guide-page.html?id=cuts">
      <div class="meta">
        <span class="ic">🥩</span>
        <span>
          <span class="name" id="navCuts"></span>
          <span class="nav-desc" id="navCutsDesc"></span>
        </span>
      </div>
      <span class="arrow">→</span>
    </a>
    <a class="dish-card" href="guide-page.html?id=alliums">
      <div class="meta">
        <span class="ic">🧅</span>
        <span>
          <span class="name" id="navAlliums"></span>
          <span class="nav-desc" id="navAlliumsDesc"></span>
        </span>
      </div>
      <span class="arrow">→</span>
    </a>
    <a class="dish-card" href="guide-page.html?id=fruit">
      <div class="meta">
        <span class="ic">🍉</span>
        <span>
          <span class="name" id="navFruit"></span>
          <span class="nav-desc" id="navFruitDesc"></span>
        </span>
      </div>
      <span class="arrow">→</span>
    </a>
    <a class="dish-card" href="guide-page.html?id=veg">
      <div class="meta">
        <span class="ic">🥬</span>
        <span>
          <span class="name" id="navVeg"></span>
          <span class="nav-desc" id="navVegDesc"></span>
        </span>
      </div>
      <span class="arrow">→</span>
    </a>
    <a class="dish-card" href="guide-page.html?id=staples">
      <div class="meta">
        <span class="ic">🧺</span>
        <span>
          <span class="name" id="navStaples"></span>
          <span class="nav-desc" id="navStaplesDesc"></span>
        </span>
      </div>
      <span class="arrow">→</span>
    </a>
  </div>

  <footer>foodie · guide</footer>

</div>

<script>
  (function () {
    const LANG_KEY = "foodie.lang";
    const $ = function (id) { return document.getElementById(id); };
    let ui = null;
    let lang = "en";

    function store(key, val) { try { localStorage.setItem(key, val); } catch (e) {} }
    function load(key) { try { return localStorage.getItem(key); } catch (e) { return null; } }

    function render() {
      const t = ui[lang];
      document.documentElement.lang = lang === "zh" ? "zh-Hant" : "en";

      $("langBtn").textContent = t.langToggle;
      $("backLink").textContent = t.homeCrumb;
      $("title").textContent = t.guideTitle;
      $("subtitle").textContent = t.guideSubtitle;
      $("navCuts").textContent = t.navCuts;
      $("navCutsDesc").textContent = t.navCutsDesc;
      $("navAlliums").textContent = t.navAlliums;
      $("navAlliumsDesc").textContent = t.navAlliumsDesc;
      $("navFruit").textContent = t.navFruit;
      $("navFruitDesc").textContent = t.navFruitDesc;
      $("navVeg").textContent = t.navVeg;
      $("navVegDesc").textContent = t.navVegDesc;
      $("navStaples").textContent = t.navStaples;
      $("navStaplesDesc").textContent = t.navStaplesDesc;
    }

    fetch("i18n.json")
      .then(function (r) { return r.json(); })
      .then(function (json) {
        ui = json.ui;
        lang = ui[load(LANG_KEY)] ? load(LANG_KEY) : "en";
        render();
      })
      .catch(function () {
        $("title").textContent =
          "Could not load text. Serve this page over HTTP.";
      });

    $("langBtn").addEventListener("click", function () {
      if (!ui) return;
      lang = (lang === "zh") ? "en" : "zh";
      store(LANG_KEY, lang);
      render();
    });
  })();
</script>
</body>
</html>
