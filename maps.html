<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Eateries · foodie</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<button id="langBtn" class="lang-btn" type="button">中文</button>
<div class="wrap">

  <header class="hero">
    <div class="brand">foodie</div>
    <h1 id="title"></h1>
    <p class="subtitle" id="subtitle"></p>
  </header>

  <div class="filters" id="filters"></div>

  <div id="map"></div>

  <div class="grid" id="grid"></div>

  <footer>foodie · eateries</footer>

</div>

<script src="assets.js"></script>
<script src="api.js"></script>
<script src="links.js"></script>
<script>
  (function () {
    const LANG_KEY = "foodie.lang";
    const $ = function (id) { return document.getElementById(id); };
    let ui = null;
    let eateries = [];       // [{ id, lat, lng, emoji, en:{…}, zh:{…} }]
    let lang = "en";
    let map = null;
    const markers = {};         // id -> [Leaflet marker per branch]

    // Filterable dimensions. arr=true → the field is an array, else a scalar.
    // loc=true → the field lives per-location (union across all of an eatery's
    // locations); top=true → language-neutral top-level; else current-lang block.
    const DIMS = [
      { key: "mainType", arr: false, label: "filterMainType" },
      { key: "city",     arr: false, loc: true, label: "filterCity" },
      { key: "district", arr: false, loc: true, label: "filterDistrict" },
      { key: "shoppingDistrict", arr: true,  loc: true, label: "filterShoppingDistrict" },
      { key: "mealtime", arr: true,  label: "filterMealtime" },
      { key: "partySize", arr: true, top: true, label: "filterPartySize" },
      { key: "service",  arr: true,  label: "filterService" },
      { key: "tags",     arr: true,  label: "filterTags" },
      { key: "price",    arr: false, top: true, label: "filterPrice" }
    ];
    // Mealtime chips read in day order rather than insertion order.
    const MEALTIME_ORDER = {
      en: ["Breakfast", "Lunch", "Dinner", "Late-night"],
      zh: ["早餐", "午餐", "晚餐", "宵夜"]
    };
    // Main-type chips read in a fixed order rather than insertion order.
    const MAINTYPE_ORDER = {
      en: ["Meal", "Drinks", "Dessert", "Bar"],
      zh: ["正餐", "飲品", "甜點", "酒吧"]
    };
    const filters = {};         // dimension key -> Set of selected values
    DIMS.forEach(function (d) { filters[d.key] = new Set(); });

    let userPos = null;         // { lat, lng } once located
    let nearMe = false;         // sort & annotate by distance when true
    let geoState = "idle";      // idle | locating | denied
    const distances = {};       // eatery id -> km from user

    function store(key, val) { try { localStorage.setItem(key, val); } catch (e) {} }
    function load(key) { try { return localStorage.getItem(key); } catch (e) { return null; } }

    // Compose a display address from its parts, ordered per language:
    // en → "street, district, city"; zh → "city district street" (no commas).
    function fmtAddress(L_) {
      const parts = lang === "zh"
        ? [L_.city, L_.district, L_.address]
        : [L_.address, L_.district, L_.city];
      const sep = lang === "zh" ? "" : ", ";
      return parts.filter(Boolean).join(sep);
    }

    // An eatery's location points (language-neutral coordinates), one per
    // location. Every eatery has a locations[] (single-location ones hold one).
    function branchCoords(r) {
      return (r.locations || []).map(function (b) { return { lat: b.lat, lng: b.lng }; });
    }

    // An eatery's locations for display in the current language: { name, parts }
    // where parts feeds fmtAddress. name is null for an unnamed (single) location.
    function branchInfos(r) {
      return (r.locations || []).map(function (b) {
        const L_ = b[lang] || {};
        return { name: L_.name || null, parts: L_ };
      });
    }

    // The eatery's main (first) location address, formatted for the card/popup.
    function mainAddr(r) {
      const loc = (r.locations || [])[0];
      return loc ? fmtAddress(loc[lang] || {}) : "";
    }

    // Union of a per-location field (current language) across all locations.
    function locField(r, key) {
      const out = [];
      (r.locations || []).forEach(function (loc) {
        const v = loc[lang] && loc[lang][key];
        if (v == null) return;
        (Array.isArray(v) ? v : [v]).forEach(function (x) { if (out.indexOf(x) === -1) out.push(x); });
      });
      return out;
    }

    // Great-circle distance in km between two lat/lng points (haversine).
    function distanceKm(lat1, lng1, lat2, lng2) {
      const R = 6371, toRad = Math.PI / 180;
      const dLat = (lat2 - lat1) * toRad, dLng = (lng2 - lng1) * toRad;
      const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
        Math.cos(lat1 * toRad) * Math.cos(lat2 * toRad) *
        Math.sin(dLng / 2) * Math.sin(dLng / 2);
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    function fmtDistance(km) {
      const t = ui[lang];
      return km < 1 ? Math.round(km * 1000) + t.unitM : km.toFixed(1) + t.unitKm;
    }

    // Suitable party size, e.g. "2", "1–4", or "2+" (open-ended max).
    function fmtPartySize(p) {
      if (!p || p.min == null) return null;
      if (p.max == null) return p.min + "+";
      return p.min === p.max ? String(p.min) : p.min + "–" + p.max;
    }

    // Toggle the "near me" sort. Requests geolocation on first enable.
    function toggleNearMe() {
      if (nearMe) { nearMe = false; buildFilters(); applyFilters(); return; }
      if (userPos) { nearMe = true; buildFilters(); applyFilters(); return; }
      if (!navigator.geolocation) { geoState = "denied"; buildFilters(); return; }

      geoState = "locating";
      buildFilters();
      navigator.geolocation.getCurrentPosition(
        function (pos) {
          userPos = { lat: pos.coords.latitude, lng: pos.coords.longitude };
          geoState = "idle";
          nearMe = true;
          buildFilters();
          applyFilters();
        },
        function () { geoState = "denied"; nearMe = false; buildFilters(); },
        { enableHighAccuracy: false, timeout: 8000, maximumAge: 600000 }
      );
    }

    function el(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text != null) node.textContent = text;
      return node;
    }

    // Google Maps search URL for an eatery (name + address finds the real
    // place even though our stored coordinates are approximate).
    function gmapsUrl(r) {
      return FoodieLinks.gmaps(r[lang].name + " " + mainAddr(r));
    }

    // Internal link to this eatery's menu page.
    function menuUrl(r) { return "menu.html?id=" + encodeURIComponent(r.id); }

    // Search queries use name + city to disambiguate chains.
    function nameQuery(r) {
      const loc = (r.locations || [])[0];
      const city = (loc && loc[lang] && loc[lang].city) || "";
      return r[lang].name + " " + city;
    }
    function webUrl(r) { return FoodieLinks.webSearch(nameQuery(r)); }
    function youtubeUrl(r) { return FoodieLinks.youtubeSearch(nameQuery(r)); }

    // Build an external link that opens safely in a new tab.
    function extLink(className, text, href) {
      const a = el("a", className, text);
      a.href = href;
      a.target = "_blank";
      a.rel = "noopener";
      return a;
    }

    function initMap() {
      map = L.map("map", { scrollWheelZoom: false });
      L.tileLayer(FoodieLinks.tileUrl, {
        maxZoom: 19,
        attribution: FoodieLinks.tileAttribution
      }).addTo(map);

      const bounds = [];
      eateries.forEach(function (r) {
        markers[r.id] = branchCoords(r).map(function (p) {
          const m = L.marker([p.lat, p.lng]).addTo(map);
          bounds.push([p.lat, p.lng]);
          m.on("click", function () { focus(r.id, false); });
          return m;
        });
      });

      if (bounds.length === 1) map.setView(bounds[0], 15);
      else if (bounds.length) map.fitBounds(bounds, { padding: [40, 40] });
      else map.setView([25.04, 121.54], 13);
    }

    // Bind a localized popup to each marker, refreshed on language change.
    // Branch markers get the branch name appended and their own address.
    function bindPopups() {
      eateries.forEach(function (r) {
        const L_ = r[lang];
        const ms = markers[r.id] || [];
        const infos = branchInfos(r);
        ms.forEach(function (m, i) {
          const info = infos[i];
          const wrap = document.createElement("div");
          const name = (info && info.name) ? L_.name + " · " + info.name : L_.name;
          wrap.appendChild(el("span", "pop-name", name));
          wrap.appendChild(el("span", "pop-cuisine", L_.cuisine));
          wrap.appendChild(el("span", "pop-addr", fmtAddress(info ? info.parts : L_)));
          m.bindPopup(wrap);
        });
      });
    }

    // Pan/zoom to an eatery and highlight its card.
    function focus(id, openPopup) {
      const r = eateries.find(function (x) { return x.id === id; });
      if (!r || !map) return;
      const c = branchCoords(r)[0];
      if (c) map.setView([c.lat, c.lng], 16, { animate: true });
      const ms = markers[id];
      if (openPopup !== false && ms && ms[0]) ms[0].openPopup();

      Array.prototype.forEach.call(
        document.querySelectorAll(".eatery-card"),
        function (c) { c.classList.toggle("active", c.dataset.id === id); }
      );
    }

    /** partySize is a {min,max} range, not a chip string. Expand it into the
     * discrete head-counts a place seats so the standard set-filter can match
     * "fits a party of N". An open-ended max (null) fills up to the largest
     * finite capacity in the data; that cap also bounds the chip list.
     */
    let _partyCap = null;
    function partyCap() {
      if (_partyCap == null) {
        let m = 0;
        eateries.forEach(function (r) {
          const p = r.partySize;
          if (p && p.max != null) m = Math.max(m, p.max);
        });
        _partyCap = m || 6;
      }
      return _partyCap;
    }
    function partySizeValues(p) {
      if (!p || p.min == null) return [];
      const hi = p.max == null ? partyCap() : Math.min(p.max, partyCap());
      const out = [];
      for (let n = p.min; n <= hi; n++) out.push(String(n));
      return out;
    }

    // Values of a dimension for one eatery. top=language-neutral top-level;
    // loc=per-location (unioned across the eatery's locations); else the
    // current-language eatery block.
    function valuesFor(r, d) {
      if (d.key === "partySize") return partySizeValues(r.partySize);
      if (d.loc) return locField(r, d.key);
      const v = d.top ? r[d.key] : r[lang][d.key];
      if (v == null) return [];
      return d.arr ? v : [v];
    }

    // A eatery matches when, for every dimension with a selection, at
    // least one of its values is selected (AND across dims, OR within a dim).
    function matches(r) {
      return DIMS.every(function (d) {
        const sel = filters[d.key];
        if (!sel.size) return true;
        return valuesFor(r, d).some(function (v) { return sel.has(v); });
      });
    }

    // Distinct values of a dimension across all eateries (insertion order).
    function distinctValues(d) {
      const seen = [];
      eateries.forEach(function (r) {
        valuesFor(r, d).forEach(function (v) {
          if (seen.indexOf(v) === -1) seen.push(v);
        });
      });
      // Price reads naturally low → high ($, $$, $$$).
      if (d.key === "price") seen.sort(function (a, b) { return a.length - b.length; });
      // Party size reads low → high (1, 2, 3 …).
      if (d.key === "partySize") seen.sort(function (a, b) { return (+a) - (+b); });
      // Main type reads in a fixed order (meal → drinks → dessert → bar).
      if (d.key === "mainType") {
        const order = MAINTYPE_ORDER[lang] || [];
        seen.sort(function (a, b) {
          const ia = order.indexOf(a), ib = order.indexOf(b);
          return (ia === -1 ? order.length : ia) - (ib === -1 ? order.length : ib);
        });
      }
      // Mealtime reads in day order (breakfast → late-night).
      if (d.key === "mealtime") {
        const order = MEALTIME_ORDER[lang] || [];
        seen.sort(function (a, b) {
          const ia = order.indexOf(a), ib = order.indexOf(b);
          return (ia === -1 ? order.length : ia) - (ib === -1 ? order.length : ib);
        });
      }
      return seen;
    }

    // Build the filter panel: one group of toggle chips per dimension.
    function buildFilters() {
      const t = ui[lang];
      const host = $("filters");
      host.innerHTML = "";

      // Location control: "Near me" toggle (sorts the list by distance).
      const geoGroup = el("div", "filter-group");
      geoGroup.appendChild(el("span", "filter-label", t.filterLocation));
      const label = geoState === "locating" ? t.locating
        : geoState === "denied" ? t.locationDenied
        : t.nearMe;
      const geoChip = el("button", "filter-chip" + (nearMe ? " on" : ""), "📍 " + label);
      geoChip.type = "button";
      geoChip.disabled = geoState === "locating";
      geoChip.addEventListener("click", toggleNearMe);
      geoGroup.appendChild(geoChip);
      host.appendChild(geoGroup);

      DIMS.forEach(function (d) {
        const values = distinctValues(d);
        if (!values.length) return;
        const group = el("div", "filter-group");
        group.appendChild(el("span", "filter-label", ui[lang][d.label]));
        values.forEach(function (v) {
          const chip = el("button", "filter-chip", v);
          chip.type = "button";
          if (filters[d.key].has(v)) chip.classList.add("on");
          chip.addEventListener("click", function () {
            if (filters[d.key].has(v)) filters[d.key].delete(v);
            else filters[d.key].add(v);
            chip.classList.toggle("on");
            applyFilters();
          });
          group.appendChild(chip);
        });
        host.appendChild(group);
      });
    }

    // Render the card list for the given (filtered) eateries.
    function renderList(list) {
      const t = ui[lang];
      const grid = $("grid");
      grid.innerHTML = "";

      if (!list.length) {
        grid.appendChild(el("p", "empty", t.noResults));
        return;
      }

      list.forEach(function (r) {
        const L_ = r[lang];
        const card = el("a", "eatery-card");
        card.href = menuUrl(r);
        card.target = "_blank";
        card.rel = "noopener";
        card.dataset.id = r.id;
        // Clicking the card also pans the map to this eatery. We don't
        // preventDefault, so the menu page still opens in its new tab.
        // "click" covers left-click; "auxclick" (button 1) covers the
        // middle-click that opens a background tab.
        card.addEventListener("click", function () { focus(r.id); });
        card.addEventListener("auxclick", function (e) {
          if (e.button === 1) focus(r.id);
        });

        card.appendChild(el("span", "ic", r.emoji || "🍴"));

        // Display order: name, address, mealtime, tags, hasBranches, cuisine, note.
        const body = el("div", "body");
        body.appendChild(el("div", "name", L_.name));
        body.appendChild(el("div", "addr", mainAddr(r)));

        // shoppingDistrict / mealtime / tags / service / branches rendered as chips (skip if all absent).
        const areas = locField(r, "shoppingDistrict");
        const meals = L_.mealtime || [];
        const tags = L_.tags || [];
        const service = L_.service || [];
        const hasDist = nearMe && userPos && distances[r.id] != null;
        const party = fmtPartySize(r.partySize);
        if (hasDist || r.price || party || areas.length || meals.length || tags.length || service.length || r.hasBranches) {
          const chips = el("div", "chips");
          if (hasDist) chips.appendChild(el("span", "chip chip-dist", "📏 " + fmtDistance(distances[r.id])));
          areas.forEach(function (a) { chips.appendChild(el("span", "chip chip-area", "📍 " + a)); });
          tags.forEach(function (g) { chips.appendChild(el("span", "chip chip-tag", g)); });
          if (r.price) chips.appendChild(el("span", "chip chip-price", r.price));
          if (party) chips.appendChild(el("span", "chip chip-party", "👥 " + party));
          meals.forEach(function (m) { chips.appendChild(el("span", "chip chip-meal", m)); });
          service.forEach(function (s) { chips.appendChild(el("span", "chip chip-service", s)); });
          if (r.hasBranches) chips.appendChild(el("span", "chip chip-branch", "🏬 " + t.branches));
          body.appendChild(chips);
        }

        body.appendChild(el("div", "cuisine", L_.cuisine));
        if (L_.note) body.appendChild(el("div", "note", L_.note));
        card.appendChild(body);

        // Card is an <a href target="_blank"> to the menu page, so a click
        // opens it in a new tab.
        grid.appendChild(card);
      });
    }

    // Show only matching markers and refit the map to them.
    function updateMarkers(list) {
      if (!map) return;
      const visible = {};
      list.forEach(function (r) { visible[r.id] = true; });
      const bounds = [];
      eateries.forEach(function (r) {
        const ms = markers[r.id];
        if (!ms) return;
        const pts = branchCoords(r);
        ms.forEach(function (m, i) {
          if (visible[r.id]) {
            if (!map.hasLayer(m)) m.addTo(map);
            if (pts[i]) bounds.push([pts[i].lat, pts[i].lng]);
          } else if (map.hasLayer(m)) {
            map.removeLayer(m);
          }
        });
      });
      if (bounds.length) map.fitBounds(bounds, { padding: [40, 40], maxZoom: 16 });
    }

    // Apply current filters to both the list and the map.
    function applyFilters() {
      let list = eateries.filter(matches);
      if (nearMe && userPos) {
        eateries.forEach(function (r) {
          let best = Infinity;
          branchCoords(r).forEach(function (p) {
            best = Math.min(best, distanceKm(userPos.lat, userPos.lng, p.lat, p.lng));
          });
          distances[r.id] = best;
        });
        list = list.slice().sort(function (a, b) {
          return distances[a.id] - distances[b.id];
        });
      }
      renderList(list);
      updateMarkers(list);
    }

    function render() {
      const t = ui[lang];
      document.documentElement.lang = lang === "zh" ? "zh-Hant" : "en";

      $("langBtn").textContent = t.langToggle;
      $("title").textContent = t.mapsTitle;
      $("subtitle").textContent = t.mapsSubtitle;

      buildFilters();
      if (map) bindPopups();
      applyFilters();
    }

    Promise.all([
      fetch("i18n.json").then(function (r) { return r.json(); }),
      FoodieApi.getEateries(),
      FoodieAssets.loadLeaflet()
    ])
      .then(function (res) {
        ui = res[0].ui;
        eateries = res[1];
        lang = ui[load(LANG_KEY)] ? load(LANG_KEY) : "en";
        initMap();
        render();
      })
      .catch(function () {
        $("grid").innerHTML =
          "<p style='color:var(--muted)'>Could not load eatery data. Serve this page over HTTP (e.g. <code>python -m http.server</code>) — browsers block fetch on file://.</p>";
      });

    $("langBtn").addEventListener("click", function () {
      if (!ui) return;
      lang = (lang === "zh") ? "en" : "zh";
      store(LANG_KEY, lang);
      // Filter values are language-specific, so reset selections on switch.
      DIMS.forEach(function (d) { filters[d.key].clear(); });
      render();
    });
  })();
</script>
</body>
</html>
